<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10141a" />
    <meta
      name="description"
      content="情報処理安全確保支援士（SC）の略語を1枚ずつ確認するフラッシュカード。"
    />
    <title>SC 略語カード</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="mast">
        <p class="eyebrow">情報処理安全確保支援士</p>
        <h1>略語カード</h1>
        <p class="progress" id="progress" aria-live="polite">読み込み中</p>
      </header>

      <button type="button" class="card" id="card" aria-expanded="false" disabled>
        <span class="kicker" id="kicker">略語</span>
        <span class="acronym" id="acronym">…</span>
        <span class="prompt" id="prompt">用語データを読んでいます</span>
        <span class="answer" id="answer" hidden>
          <span class="field">
            <span class="field-label">正式名称</span>
            <span class="formal" id="formal"></span>
          </span>
          <span class="field">
            <span class="field-label">一言定義</span>
            <span class="definition" id="definition"></span>
          </span>
          <span class="field">
            <span class="field-label">分類</span>
            <span class="category" id="category"></span>
          </span>
        </span>
      </button>

      <div class="actions">
        <button type="button" class="primary" id="action" disabled>答えを見る</button>
      </div>

      <p class="note" id="note" role="status"></p>
    </main>

    <p class="sr-only" id="live" aria-live="polite"></p>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
