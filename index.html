<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#10141a" />
    <meta
      name="description"
      content="情報処理安全確保支援士（SC）の略語を、カテゴリを選んで1枚ずつ確認するフラッシュカード。"
    />
    <title>SC 略語カード</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <header class="mast">
        <div class="mast-row">
          <div>
            <p class="eyebrow">情報処理安全確保支援士</p>
            <h1>略語カード</h1>
          </div>
          <a href="#top" class="back-link" id="back-link" data-back hidden>トップへ</a>
        </div>
        <p class="progress" id="progress" aria-live="polite"></p>
      </header>

      <section id="home" class="panel">
        <form id="setup" class="setup">
          <label class="field" for="category">
            カテゴリー
            <select id="category" name="category"></select>
          </label>

          <fieldset class="orders">
            <legend>出題順</legend>
            <label class="choice">
              <input type="radio" name="order" value="abc" checked />
              ABC順
            </label>
            <label class="choice">
              <input type="radio" name="order" value="random" />
              ランダム
            </label>
          </fieldset>

          <p class="form-error" id="home-error" role="alert" hidden></p>

          <div class="actions">
            <button type="submit" class="btn primary" id="start">スタート</button>
            <button type="button" class="btn secondary" id="glossary">用語一覧</button>
          </div>
        </form>
      </section>

      <section id="quiz" class="panel" hidden>
        <div class="card" id="card" aria-expanded="false">
          <span class="category" id="category-chip" hidden></span>
          <span class="acronym" id="acronym"></span>
          <span class="answer" id="answer" hidden>
            <span class="formal" id="formal"></span>
            <span class="definition" id="definition"></span>
          </span>
        </div>
        <p class="note" id="note" role="status"></p>
      </section>

      <section id="list" class="panel" hidden>
        <p class="list-meta" id="list-meta"></p>
        <div id="list-body" class="glossary"></div>
        <p class="back-row">
          <a href="#top" class="back-link" data-back>トップへ</a>
        </p>
      </section>
    </main>

    <p class="sr-only" id="live" aria-live="polite"></p>

    <script src="data.js"></script>
    <script src="app.js"></script>
  </body>
</html>
